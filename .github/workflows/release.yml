name: Release

# Builds the sdist and one wheel per platform, smoke-tests the wheels in clean
# environments, and publishes with PyPI Trusted Publishing (OIDC, no API
# tokens).
#
# The wheels carry the compiled Rust core (neuroclamp._core). It is built
# against Python's stable ABI (abi3), so one wheel per platform serves every
# supported Python version.
#
# - Pull requests that touch packaging: build and smoke-test only.
# - Manual run (workflow_dispatch): build and smoke-test; on main, also publish
#   to TestPyPI.
# - Tag push vX.Y.Z: build, smoke-test, publish to TestPyPI, then PyPI.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - neuroclamp/**
      - neuroclamp_ui/**
      - rust/**
      - tools/check_dist.py
      - tools/smoke_test.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          - { platform: macos-x86_64, runner: macos-latest, target: x86_64 }
          - { platform: macos-arm64, runner: macos-latest, target: aarch64 }
          - { platform: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # manylinux applies to the Linux builds only; maturin builds them
          # in a manylinux container so PyPI accepts the wheels.
          manylinux: auto
          args: --release --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  build:
    # Collects every artifact and checks their contents.
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check artifact contents
        run: uv run --no-project python tools/check_dist.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-core:
    # The library alone, installed from this platform's wheel with no
    # repository checkout on sys.path and without the ui extra.
    needs: build
    name: smoke-core (${{ matrix.runner }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install this platform's wheel without extras
        run: |
          venv="$RUNNER_TEMP/venv"
          uv venv "$venv" --python ${{ matrix.python }}
          # Pick the one wheel built for this OS and architecture.
          wheel="$(uv run --no-project --python "$venv" python -I - <<'EOF'
          import glob
          import platform
          import sys

          # The machine's architecture, not sysconfig.get_platform(): a
          # universal2 Python on macOS reports "universal2" there.
          arch = platform.machine().lower()  # x86_64, aarch64, arm64, amd64
          marker = {"linux": "manylinux", "darwin": "macosx", "win32": "win"}[
              sys.platform
          ]
          wheels = [
              w for w in glob.glob("dist/*.whl")
              if marker in w and w.endswith(f"_{arch}.whl")
          ]
          assert len(wheels) == 1, (sys.platform, arch, glob.glob("dist/*.whl"))
          print(wheels[0])
          EOF
          )"
          echo "Installing $wheel"
          uv pip install --python "$venv" "$wheel"
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Run a simulation on both backends and the CLI
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python "$VENV" python -I - <<'EOF'
          import importlib.util

          import numpy as np

          import neuroclamp
          from neuroclamp import simulate_current_clamp, step_current

          neuron = neuroclamp.NEURON_PRESETS["Squid Giant Axon (Classic HH)"]()
          stimulus = step_current(duration=20.0, current_amplitude=15.0)
          result = simulate_current_clamp(neuron, current_external=stimulus)
          aps = neuroclamp.analyze_aps(result["time"], result["voltage"])
          assert aps.spike_count >= 1, aps.spike_count
          rust = simulate_current_clamp(neuron, stimulus, backend="rust")
          np.testing.assert_allclose(
              rust["voltage"], result["voltage"], rtol=1e-9, atol=1e-9
          )
          for module in ("reflex", "plotly", "rxconfig"):
              assert importlib.util.find_spec(module) is None, module
          print("core library OK:", aps.spike_count, "spikes; Rust backend matches")
          EOF
          uv run --no-project --python "$VENV" neuroclamp --help
          uv run --no-project --python "$VENV" neuroclamp --version
          if uv run --no-project --python "$VENV" neuroclamp ui 2> ui.err; then
            echo "neuroclamp ui should fail without the ui extra"
            exit 1
          fi
          grep -q 'pip install "neuroclamp\[ui\]"' ui.err
          if grep -q Traceback ui.err; then cat ui.err; exit 1; fi

  smoke-ui:
    # The full app from the wheel with the ui extra, started from outside the
    # repository, then driven through a simulation in a headless browser.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the wheel with the ui extra
        run: |
          uv venv "$RUNNER_TEMP/venv" --python 3.12
          wheel="$(ls dist/*manylinux*_x86_64.whl)"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "${wheel}[ui]"
          "$RUNNER_TEMP/venv/bin/python" -I -c \
            "import importlib.util as u; assert u.find_spec('rxconfig') is None"

      - name: Start neuroclamp ui
        working-directory: ${{ runner.temp }}
        run: |
          nohup venv/bin/neuroclamp ui --no-browser --port 3000 > neuroclamp.log 2>&1 &
          echo $! > neuroclamp.pid

      - name: Wait for the app
        run: |
          # The first launch installs bun and builds the frontend.
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 5 http://localhost:3000/ping; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/neuroclamp.pid")" 2>/dev/null; then
              echo "neuroclamp exited before the app came up"
              exit 1
            fi
            sleep 5
          done
          echo "App did not respond within 10 minutes"
          exit 1

      - name: Smoke-test HTTP routes
        run: |
          curl -fsS --max-time 10 http://localhost:3000/ | grep -qi '<html'
          curl -fsS --max-time 10 -o /dev/null http://localhost:3000/help
          curl -fsS --max-time 10 -o /dev/null http://localhost:3000/screenshots/overview.png

      - name: Run a simulation end to end in a browser
        run: |
          uv sync --frozen --no-install-project --only-group=browser
          uv run --frozen --no-sync playwright install --with-deps chromium
          NEUROCLAMP_URL=http://localhost:3000 uv run --frozen --no-sync python tools/smoke_test.py

      - name: neuroclamp logs
        if: always()
        run: cat "$RUNNER_TEMP/neuroclamp.log" || true

  publish-testpypi:
    needs: [smoke-core, smoke-ui]
    # Tags, or a manual run from main; other branches never publish.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/neuroclamp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/neuroclamp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
