name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group=dev --extra=ui

      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Type check
        run: uvx ty check

  rust:
    # The compiled core in rust/: formatting, lints, and the pure-Rust tests
    # (no Python needed with --no-default-features). The Python jobs build it
    # as part of `uv sync`; the runner image ships a Rust toolchain.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v7

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --no-default-features

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, ui, e2e]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group=dev --extra=ui

      - name: Run ${{ matrix.suite }} tests
        run: uv run --frozen -m pytest tests/${{ matrix.suite }} --verbose

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group=docs

      - name: Build docs (strict)
        run: uv run --frozen mkdocs build --strict
