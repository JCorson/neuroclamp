[project]
name = "neuroclamp"
version = "0.1.0"
description = "Patch clamp experiment simulator implementing the Hodgkin-Huxley model for neuronal electrophysiology"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "electrophysiology",
    "patch-clamp",
    "hodgkin-huxley",
    "neuroscience",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.5.1",
    "matplotlib>=3.11.1",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
ui = [
    "platformdirs>=4",
    "plotly>=6.9.0",
    "reflex[pydantic]>=0.11.0",
]

[project.scripts]
neuroclamp = "neuroclamp_ui.cli:main"

[project.urls]
Homepage = "https://github.com/JCorson/neuroclamp"
Documentation = "https://jcorson.github.io/neuroclamp/"
Source = "https://github.com/JCorson/neuroclamp"
Issues = "https://github.com/JCorson/neuroclamp/issues"
Changelog = "https://github.com/JCorson/neuroclamp/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

# maturin compiles the Rust crate in rust/ into the extension module
# neuroclamp._core and packages it with the pure-Python neuroclamp package
# (found next to this file, as the first part of module-name) and
# neuroclamp_ui. The sdist also carries the Rust sources, so building from it
# needs a Rust toolchain; the published wheels do not.
[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "neuroclamp._core"
python-packages = ["neuroclamp_ui"]
include = [{ path = "CHANGELOG.md", format = "sdist" }]
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["./neuroclamp", "./neuroclamp_ui", "./tests"]

[[tool.ty.overrides]]
include = [
    "neuroclamp_ui/**",
    "tests/ui/test_state.py",
    "tests/ui/test_plotting.py",
    "tests/ui/test_traces_api.py",
]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["reflex.**", "plotly.**", "neuroclamp_ui.**", "starlette.**"]

# NumPy structured arrays use string-key subscript assignment which ty does not
# model. Suppress the false-positive invalid-assignment errors in files that
# build or read structured arrays.
[[tool.ty.overrides]]
include = [
    "neuroclamp/clamp_simulations.py",
    "tests/ui/test_plotting.py",
    "tests/ui/test_state.py",
    "tests/unit/test_burst_metrics.py",
    "tests/unit/test_calcium_transients.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/ui"]
asyncio_mode = "auto"
addopts = "-n auto --dist=loadscope"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*multi-threaded.*fork:DeprecationWarning:multiprocessing",
    # starlette.testclient uses httpx2 when it is installed and otherwise
    # falls back to httpx with a deprecation warning. Promote the whole
    # warning class to a hard error so the unsupported path cannot be taken
    # silently, whatever wording the warning carries.
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[dependency-groups]
browser = [
    "playwright>=1.49.0",
]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.uv]
# Rebuild the project (and its Rust extension) when the Rust sources change,
# not only when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/src/**/*.rs" },
]
