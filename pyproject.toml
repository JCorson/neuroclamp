[project]
name = "patch-sim"
version = "0.1.0"
description = "Patch clamp experiment simulator implementing the Hodgkin-Huxley model for neuronal electrophysiology"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "electrophysiology",
    "patch-clamp",
    "hodgkin-huxley",
    "neuroscience",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=2.5.1",
    "matplotlib>=3.11.1",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
ui = [
    "platformdirs>=4",
    "plotly>=6.9.0",
    "reflex[pydantic]>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/JCorson/patch-sim"
Documentation = "https://jcorson.github.io/patch-sim/"
Source = "https://github.com/JCorson/patch-sim"
Issues = "https://github.com/JCorson/patch-sim/issues"
Changelog = "https://github.com/JCorson/patch-sim/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patch_sim", "patch_sim_ui"]

# hatch_build.py copies the repository-root help-page screenshots into the
# standard wheel; editable installs read them from the checkout.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
    "/patch_sim",
    "/patch_sim_ui",
    "/assets/screenshots",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["./patch_sim", "./patch_sim_ui", "./tests"]

[[tool.ty.overrides]]
include = [
    "patch_sim_ui/**",
    "tests/ui/test_state.py",
    "tests/ui/test_plotting.py",
    "tests/ui/test_traces_api.py",
]

[tool.ty.overrides.analysis]
replace-imports-with-any = ["reflex.**", "plotly.**", "patch_sim_ui.**", "starlette.**"]

# NumPy structured arrays use string-key subscript assignment which ty does not
# model. Suppress the false-positive invalid-assignment errors in files that
# build or read structured arrays.
[[tool.ty.overrides]]
include = [
    "patch_sim/clamp_simulations.py",
    "tests/ui/test_plotting.py",
    "tests/ui/test_state.py",
    "tests/unit/test_burst_metrics.py",
    "tests/unit/test_calcium_transients.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/ui"]
asyncio_mode = "auto"
addopts = "-n auto --dist=loadscope"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*multi-threaded.*fork:DeprecationWarning:multiprocessing",
    # starlette.testclient uses httpx2 when it is installed and otherwise
    # falls back to httpx with a deprecation warning. Promote the whole
    # warning class to a hard error so the unsupported path cannot be taken
    # silently, whatever wording the warning carries.
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[dependency-groups]
browser = [
    "playwright>=1.49.0",
]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]
