[package]
name = "patch_sim_core"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike: compiled current-clamp integrator for patch_sim (see issue #410)."

[lib]
# cdylib: the shared library Python imports. rlib: lets `cargo test` link the
# pure-Rust core without Python.
crate-type = ["cdylib", "rlib"]

[features]
# The Python bindings are optional so the simulation core builds and tests
# without a Python interpreter: `cargo test --no-default-features`.
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pyo3 = { version = "0.30.1", optional = true }
numpy = { version = "0.30.0", optional = true }

[profile.release]
# Whole-program optimization; worthwhile for a small numeric kernel.
lto = true
codegen-units = 1
