[package]
name = "neuroclamp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"
description = "Compiled current- and voltage-clamp integrators for the neuroclamp Python package."

[lib]
# Imported from Python as `neuroclamp._core` (see [tool.maturin] in
# pyproject.toml); the #[pymodule] in src/python.rs carries the same name.
name = "_core"
# cdylib: the shared library Python imports. rlib: lets `cargo test` link the
# pure-Rust core without Python.
crate-type = ["cdylib", "rlib"]

[features]
# The Python bindings are optional so the simulation core builds and tests
# without a Python interpreter: `cargo test --no-default-features`.
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# abi3-py312: build against Python's stable ABI, so one wheel per platform
# serves Python 3.12 and every later version. All the work happens in Rust,
# so the stable ABI costs nothing measurable here.
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py312"] }
numpy = { version = "0.30.0", optional = true }
rayon = "1.12.0"

[profile.release]
# Whole-program optimization; worthwhile for a small numeric kernel.
lto = true
codegen-units = 1
